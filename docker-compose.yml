# Local stack: Postgres+pgvector and the app. Intent is computed at read time
# inside the app (no Redis, no worker).
#
#   docker compose up -d postgres   # infra only (run app via `npm run dev`)
#   docker compose up --build       # everything dockerized
#
# Shopify OAuth/embedding still needs a public tunnel to the app (port 3000).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: saleshq
      POSTGRES_PASSWORD: saleshq
      POSTGRES_DB: saleshq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleshq"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://saleshq:saleshq@postgres:5432/saleshq
      NODE_ENV: production
    # db push syncs schema (incl. pgvector extension) without migration files — MVP.
    command: sh -c "npx prisma db push --accept-data-loss && npm run start"
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
